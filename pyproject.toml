[project]
name = "open-data-assistant"
version = "0.1.0"
description = "Natural-language chat assistant over Statistics Canada's Web Data Service (WDS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai-slim>=0.0.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opensearch-py>=2.7",
    "sentence-transformers>=3.0",
]

[project.scripts]
build-catalogue = "open_data_assistant.catalogue.cli:main"
ingest-opensearch = "open_data_assistant.search.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-httpx>=0.33",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
